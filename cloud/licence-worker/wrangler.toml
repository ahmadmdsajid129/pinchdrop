# PinchDrop licence service: turns a Dodo Payments licence key into a signed PinchDrop key.
# Free Cloudflare Workers plan. Deploy: see docs/launch.md.
name = "pinchdrop-licence"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Dodo Payments product ids (Dodo dashboard → Products → each product's id, "pdt_…").
DODO_PRODUCT_LIFETIME = ""
DODO_PRODUCT_YEARLY = ""
DODO_PRODUCT_MONTHLY = ""
# Optional: a family / team pack (one-time, bigger activation limit set in Dodo).
DODO_PRODUCT_FAMILY = ""
# Live payments. For a test run use "https://test.dodopayments.com".
DODO_BASE = "https://live.dodopayments.com"

# Secret (never here): PD_SIGNING_KEY = the contents of
# %USERPROFILE%\.pinchdrop\license-signing-key.pem
#   Get-Content "$env:USERPROFILE.pinchdropicense-signing-key.pem" -Raw | npx wrangler secret put PD_SIGNING_KEY
