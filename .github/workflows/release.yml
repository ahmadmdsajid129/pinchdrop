name: Release

# Push a tag like v2.0.1 (matching the version in apps/desktop/src-tauri/tauri.conf.json) to publish:
#  - the Windows installer + the signed update file (latest.json) as a GitHub Release, which
#    installed copies of PinchDrop pick up by themselves;
#  - the phone app: the website APK on the release, and the Play Store bundle as a build artifact.
# Secrets needed (repo Settings → Secrets and variables → Actions), see docs/launch.md:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (updates)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   (phone app)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer + update
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Gesture tests
        run: pnpm test

      - name: Build, sign the update, publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: PinchDrop v__VERSION__
          releaseBody: |
            Download **PinchDrop_*_x64-setup.exe** for Windows and **PinchDrop.apk** for Android.
            Already have PinchDrop? It updates itself.
          releaseDraft: false
          prerelease: false

  android:
    name: Phone app (website APK + Play bundle)
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Release signing key
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PWD/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleFullRelease bundlePlayRelease --stacktrace
          cp app/build/outputs/apk/full/release/*.apk PinchDrop.apk

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/android/PinchDrop.apk

      - name: Keep the Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: pinchdrop-play-bundle
          path: apps/android/app/build/outputs/bundle/playRelease/
