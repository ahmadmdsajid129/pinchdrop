[package]
name = "pinchdrop-desktop"
version = "0.1.0"
description = "PinchDrop for Windows"
authors = ["PinchDrop Contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "pinchdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 3 link: TLS WebSocket server, pairing crypto, mDNS discovery, QR code
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
urlencoding = "2"
mdns-sd = "0.13"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Phase 4: "Move" sends the PC copy to the Recycle Bin (never a permanent delete)
trash = "5"
# v1.1: thumbnails for the floating card (already used by Tauri, nothing new downloaded)
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }
# Phase 5: read the Explorer / Desktop selection (Shell COM), Ctrl+Shift+Space, camera permission in WebView2.
# Same versions Tauri already uses, so nothing extra is downloaded.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
webview2-com = "0.39"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
